<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="../_shared/css/common.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main">
        <!-- Mappool Text -->
        <img class="mappool-text" src="static/mappool-text.png">
        <div class="waiting-for-pick wait-for-pick-right" id="waiting-for-pick">waiting for purple's pick...</div>

        <!-- Player Left -->
        <div class="player-container player-left-container">
            <div class="player-profile-picture" id="player-left-profile-picture">
                <img src="../_shared/assets/profile-picture/avatar-glass-layer-1.png">
                <img src="../_shared/assets/profile-picture/avatar-glass-layer-2.png">
            </div>
            <div class="player-name player-left-name" id="player-left-name">rumii</div>
            <div class="player-line-2 player-left-line-2" id="player-left-line-2">
                <div class="player-seed" id="player-left-seed">#32</div>
                <div class="player-star-container player-left-star-container" id="player-left-star-container"></div>
            </div>
        </div>

        <!-- Player Right -->
        <div class="player-container player-right-container">
            <div class="player-profile-picture" id="player-right-profile-picture">
                <img src="../_shared/assets/profile-picture/avatar-glass-layer-1.png">
                <img src="../_shared/assets/profile-picture/avatar-glass-layer-2.png">
            </div>
            <div class="player-name player-right-name" id="player-right-name">rumii</div>
            <div class="player-line-2 player-right-line-2" id="player-right-line-2">
                <div class="player-seed" id="player-right-seed">#32</div>
                <div class="player-star-container player-right-star-container" id="player-right-star-container"></div>
            </div>
        </div>
    </div>
</body>
</html>
