<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="../_shared/css/common.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main">
        <!-- Mappool Text -->
        <img class="mappool-text" src="static/mappool-text.png">
        <div class="waiting-for-pick wait-for-pick-right" id="waiting-for-pick">waiting for purple's pick...</div>

        <!-- Player Left -->
        <div class="player-container player-left-container">
            <div class="player-profile-picture" id="player-left-profile-picture">
                <img src="../_shared/assets/profile-picture/avatar-glass-layer-1.png">
                <img src="../_shared/assets/profile-picture/avatar-glass-layer-2.png">
            </div>
            <div class="player-name player-left-name" id="player-left-name">rumii</div>
            <div class="player-line-2 player-left-line-2" id="player-left-line-2">
                <div class="player-seed" id="player-left-seed">#32</div>
                <div class="player-star-container player-left-star-container" id="player-left-star-container"></div>
            </div>
        </div>

        <!-- Player Right -->
        <div class="player-container player-right-container">
            <div class="player-profile-picture" id="player-right-profile-picture">
                <img src="../_shared/assets/profile-picture/avatar-glass-layer-1.png">
                <img src="../_shared/assets/profile-picture/avatar-glass-layer-2.png">
            </div>
            <div class="player-name player-right-name" id="player-right-name">rumii</div>
            <div class="player-line-2 player-right-line-2" id="player-right-line-2">
                <div class="player-seed" id="player-right-seed">#32</div>
                <div class="player-star-container player-right-star-container" id="player-right-star-container"></div>
            </div>
        </div>

        <!-- Now Playing -->
        <div class="now-playing-area">
            <div class="now-playing-background"></div>
            <!-- <img class="now-playing-panel" src="static/song-now-panel.png"> -->
            <div class="now-playing-metadata now-playing-artist">Demetori</div>
            <div class="now-playing-metadata now-playing-title">Rigid Parasise ~ Dawn of the Dead</div>
            <div class="now-playing-metadata now-playing-mapper-difficulty">// <span id="now-playing-mapper">mapper</span> <span id="now-playing-difficulty">[diffname]</span></div>
            <div class="now-playing-stats" id="now-playing-stats">
                <div class="now-playing-individual-stat">
                    <div class="now-playing-stat-text now-playing-stat-text-cs">CS</div>
                    <div class="now-playing-stat-text now-playing-stat-number" id="now-playing-stat-number-cs">5.0</div>
                </div>
                <div class="now-playing-individual-stat">
                    <div class="now-playing-stat-text now-playing-stat-text-ar">AR</div>
                    <div class="now-playing-stat-text now-playing-stat-number" id="now-playing-stat-number-ar">9.3</div>
                </div>
                <div class="now-playing-individual-stat">
                    <div class="now-playing-stat-text now-playing-stat-text-od">OD</div>
                    <div class="now-playing-stat-text now-playing-stat-number" id="now-playing-stat-number-od">8.5</div>
                </div>
                <div class="now-playing-individual-stat">
                    <div class="now-playing-stat-text now-playing-stat-text-sr">SR</div>
                    <div class="now-playing-stat-text now-playing-stat-number" id="now-playing-stat-number-sr">6.21</div>
                </div>
            </div>
            <div class="now-playing-final-score">
                <div class="now-playing-left-final-score now-playing-win-final-score">923,567</div>
                <div class="now-playing-final-score-dash">-</div>
                <div class="now-playing-right-final-score now-playing-lose-final-score">654,234</div>
            </div>
            <img class="now-playing-mod-id" src="static/mods/DT1.png">
            <img class="now-playing-pick" src="static/picks/left-pick.png"
        </div>
    </div>
</body>
</html>
